openapi: 3.1.0
info:
  title: LibTrack API
  version: 2.0.0
  description: >
    API for tracking library books across a household's library cards. Hand-maintained: update it
    with any handler change in api/.

servers:
  - url: /api
    description: API base URL

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Session token returned by /auth/register and /auth/login. The session ends after 90 days
        without use, or at /auth/logout.
    cronSecret:
      type: http
      scheme: bearer
      description: The CRON_SECRET env var; Vercel Cron sends it automatically

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    Book:
      type: object
      required: [id, isbn, title, state]
      properties:
        id:
          type: string
          format: uuid
        isbn:
          type: string
          description: First ISBN from the library, or checkout-<checkoutId> when there is none
        title:
          type: string
        author:
          type: string
          description: First author as 'First Last' (with 'and others' if there are more)
        pictureUrl:
          type: string
          format: uri
          description: Cover image from the library, if any
        state:
          $ref: '#/components/schemas/BookState'
        dueDate:
          type: string
          format: date
          description: Library due date (YYYY-MM-DD, no time). Overdue = before today in Vancouver.
        checkoutId:
          type: string
          description: BiblioCommons loan ID; the sync matches books to loans with it
        metadataId:
          type: string
          description: The library's id for the title, shared by every copy
        lostChargeCents:
          type: [integer, 'null']
          description: >
            Set while the library charges for this book as lost. The book keeps its state
            instead of being returned, because it's still in the house.
        libraryCardId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid

    BookState:
      type: string
      description: >
        Where the book is. checked_out = borrowed, not found in the house yet; found = borrowed and
        located; returned = no longer on the card. Overdue is derived from dueDate, not a state.
      enum: [checked_out, found, returned]

    User:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    AuthResult:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Session token for the Authorization header

    Passkey:
      type: object
      required: [id, deviceType, backedUp, createdAt]
      properties:
        id:
          type: string
          description: Base64URL credential ID
        deviceType:
          type: string
          enum: [singleDevice, multiDevice]
          description: multiDevice passkeys sync between devices (iCloud Keychain, Google Password Manager)
        backedUp:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    PublicKeyCredentialCreationOptionsJSON:
      type: object
      description: >
        WebAuthn registration options, passed as-is to startRegistration({ optionsJSON }) from
        @simplewebauthn/browser. The challenge is single-use and expires after 5 minutes.

    PublicKeyCredentialRequestOptionsJSON:
      type: object
      description: >
        WebAuthn sign-in options for startAuthentication({ optionsJSON }). allowCredentials is
        empty: the browser offers whichever discoverable passkey the user has for this site.

    RegistrationResponseJSON:
      type: object
      description: The value returned by startRegistration() in @simplewebauthn/browser

    AuthenticationResponseJSON:
      type: object
      description: The value returned by startAuthentication() in @simplewebauthn/browser

    LibraryCard:
      type: object
      required: [id, number, displayName, system]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          description: Library card number (the PIN is never returned)
        displayName:
          type: string
        system:
          type: string
          enum: [nwpl]
          default: nwpl
        balanceCents:
          type: [integer, 'null']
          description: Charges minus credits from the last sync; null until a sync has read it
        balanceUpdatedAt:
          type: [string, 'null']
          format: date-time
        userId:
          type: string
          format: uuid

paths:
  # Passkey flows are two calls each: get options, let the browser create or use the passkey,
  # then send its response back for the server to verify against the stored challenge.

  /auth/registration-options:
    post:
      summary: Start creating a new account
      security: []
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '200':
          description: Registration options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyCredentialCreationOptionsJSON'
        '400':
          description: Username missing

  /auth/register:
    post:
      summary: Finish creating a new account
      security: []
      description: Verifies the new passkey, then creates the user and stores the passkey.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  $ref: '#/components/schemas/RegistrationResponseJSON'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Invalid or expired challenge, or the passkey failed verification

  /auth/login-options:
    post:
      summary: Start signing in
      security: []
      tags: [Authentication]
      responses:
        '200':
          description: Sign-in options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyCredentialRequestOptionsJSON'

  /auth/login:
    post:
      summary: Finish signing in
      security: []
      description: Verifies the passkey's signature against the stored public key.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  $ref: '#/components/schemas/AuthenticationResponseJSON'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Invalid, expired or already-used challenge
        '401':
          description: Unknown passkey or failed signature check

  /auth/me:
    get:
      summary: The signed-in user
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Authentication required

  /auth/logout:
    post:
      summary: End this device's session
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Signed out
        '401':
          description: Authentication required

  /auth/sign-out-others:
    post:
      summary: End every session of the signed-in user except this one
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Other devices signed out
        '401':
          description: Authentication required

  /auth/passkeys:
    get:
      summary: List the signed-in user's passkeys
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Passkeys, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Passkey'
        '401':
          description: Authentication required
    post:
      summary: Finish adding a passkey to the signed-in account
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  $ref: '#/components/schemas/RegistrationResponseJSON'
      responses:
        '201':
          description: Passkey added
        '400':
          description: Invalid or expired challenge, or the passkey failed verification
        '401':
          description: Authentication required

  /auth/passkey-options:
    post:
      summary: Start adding a passkey to the signed-in account
      description: excludeCredentials lists the user's existing passkeys so a device isn't registered twice.
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Registration options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyCredentialCreationOptionsJSON'
        '401':
          description: Authentication required

  /auth/passkeys/{id}:
    delete:
      summary: Remove one of the signed-in user's passkeys
      tags: [Authentication]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed
        '400':
          description: It is the user's only passkey
        '401':
          description: Authentication required
        '404':
          description: No such passkey on this account

  /books:
    get:
      summary: The signed-in user's books
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - name: states
          in: query
          required: false
          description: Comma-separated states to include, e.g. checked_out,found. Omit for all.
          schema:
            type: string
        - name: overdue
          in: query
          required: false
          description: >
            true = only books due before today (Vancouver) that aren't returned, oldest due date
            first. Combines with states.
          schema:
            type: boolean
      responses:
        '200':
          description: Books, by title (or by due date when overdue=true)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '400':
          description: states contains a value that isn't a BookState
        '401':
          description: Authentication required

    post:
      summary: Add a book by hand
      tags: [Books]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isbn, title]
              properties:
                isbn:
                  type: string
                title:
                  type: string
                pictureUrl:
                  type: string
                  format: uri
      responses:
        '201':
          description: Book created (state found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '401':
          description: Authentication required

  /books/states:
    put:
      summary: Change the state of one or more books
      tags: [Books]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    required: [id, state]
                    properties:
                      id:
                        type: string
                        format: uuid
                      state:
                        $ref: '#/components/schemas/BookState'
      responses:
        '200':
          description: The updated books (ids not owned by the user are skipped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '400':
          description: updates missing, or an entry without an id or with an unknown state
        '401':
          description: Authentication required

  /books/identify:
    post:
      summary: Which of the user's still-out books are in a photo
      description: >
        Sends the photo and the user's checked_out books to Gemini. Changes nothing; the client
        shows the matches and marks the ones the user confirms with PUT /books/states.
      tags: [Books]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image, mimeType]
              properties:
                image:
                  type: string
                  description: Base64 image, at most 3 MB decoded (Vercel caps the whole request at 4.5 MB)
                mimeType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, image/heic, image/heif]
      responses:
        '200':
          description: Book ids, split by how sure the model is
          content:
            application/json:
              schema:
                type: object
                required: [sure, maybe]
                properties:
                  sure:
                    type: array
                    items:
                      type: string
                      format: uuid
                  maybe:
                    type: array
                    items:
                      type: string
                      format: uuid
        '400':
          description: Missing image or unsupported type
        '401':
          description: Authentication required
        '413':
          description: Photo too large
        '429':
          description: Photo matching is busy (every model rate-limited or overloaded)
        '502':
          description: Photo matching failed
        '503':
          description: Photo matching isn't set up (no GEMINI_API_KEY)

  /books/{id}:
    delete:
      summary: Delete a book
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Book deleted
        '401':
          description: Authentication required
        '404':
          description: Book not found or access denied

  /sync-books:
    get:
      summary: Sync every library card with BiblioCommons (daily Vercel cron)
      description: >
        For each card: log in, fetch current checkouts and fines, match loans to books by
        checkoutId, create new loans, keep books billed as lost (with lostChargeCents), mark other
        books the library no longer lists as returned, and update the card's balance. A card that
        fails (login error, unexpected response) is left untouched.
      tags: [Sync]
      security:
        - cronSecret: []
      responses:
        '200':
          description: Every card synced
        '401':
          description: Missing or wrong CRON_SECRET
        '500':
          description: At least one card failed; the body lists per-card results and errors

  /library-cards:
    get:
      summary: Get list of library cards
      tags:
        - Library Cards
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of library cards belonging to the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryCard'
        '401':
          description: Authentication required

    post:
      summary: Create a new library card
      tags:
        - Library Cards
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number
                - pin
                - displayName
                - system
              properties:
                number:
                  type: string
                  description: Library card number
                pin:
                  type: string
                  description: Library card PIN
                displayName:
                  type: string
                  description: User-defined display name for the library card
                system:
                  type: string
                  enum: [nwpl]
                  default: nwpl
                  description: The library system this card belongs to
      responses:
        '201':
          description: Library card created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCard'
        '401':
          description: Authentication required

  /library-cards/{id}:
    put:
      summary: Update a library card
      tags:
        - Library Cards
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - number
                - displayName
                - system
              properties:
                number:
                  type: string
                  description: Library card number
                pin:
                  type: string
                  description: New PIN; omit to keep the current one
                displayName:
                  type: string
                  description: User-defined display name for the library card
                system:
                  type: string
                  enum: [nwpl]
                  default: nwpl
                  description: The library system this card belongs to
      responses:
        '200':
          description: Library card updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCard'
        '401':
          description: Authentication required
        '404':
          description: Library card not found or access denied

    delete:
      summary: Delete a library card
      tags:
        - Library Cards
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Library card deleted successfully
        '401':
          description: Authentication required
        '404':
          description: Library card not found or access denied
