# Local Postgres for development and tests. Never point local dev at the production database.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: libtrack
    ports:
      - '54329:5432'
    volumes:
      - libtrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d libtrack']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  libtrack-db:
